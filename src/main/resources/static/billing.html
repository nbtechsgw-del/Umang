<div class="container mt-4">
<h2>Billing Management</h2>
<form id="billingForm">
    <div class="row g-3">
        <div class="col-md-6">
            <select id="patientId" class="form-select" required>
                <option value="">Select Patient</option>
            </select>
        </div>
        <div class="col-md-6">
            <input type="number" id="amount" class="form-control" placeholder="Enter Amount" min="0" step="0.01" oninput="calculateTotal()" required>
        </div>
        <div class="col-md-6">
            <a>GST Percentage</a>
            <input type="number" id="gst" class="form-control" placeholder="GST 18%" value="18"  readonly>
        </div>
        <div class="col-md-6">
            <input type="number" id="totalAmount" class="form-control" placeholder="Total Amount"  readonly>
        </div>
        <div class="col-md-6">
            <select id="paymentStatus" class="form-select" required>
                <option value="">Select Status</option>
                <option value="PAID">Paid</option>
                <option value="PENDING">Pending</option>
            </select>
        </div>
        <div class="col-md-6">
            <select id="paymentMethod" class="form-select" required>
                <option value="">Select Payment Method</option>
                <option value="Cash">Cash</option>
                <option value="Card">Card</option>
                <option value="UPI">UPI</option>
                <option value="Net Banking">Net Banking</option>
                <option value="Insurance">Insurance</option>
            </select>
        </div>
        <div class="col-md-12">
            <input type="date" id="billingDate" class="form-control">
        </div>
        <div class="col-md-12 text-center">
            <button type="button" class="btn btn-primary px-4" onclick="createBill()"> Generate Bill</button>
        </div>
    </div>
</form>

<h3>Billing Records</h3>

<table class="table table-bordered table-hover" width="100%">

    <thead>
        <tr>
            <th>Bill ID</th>
            <th>Patient ID</th>
            <th>Invoice ID</th>
            <th>Amount</th>
            <th>GST %</th>
            <th>Total Amount</th>
            <th>Status</th>
            <th>Method</th>
            <th>Date</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="billingTable"></tbody>

</table>
</div>
