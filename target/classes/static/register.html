<!DOCTYPE html>
<html>

<head>

    <title>Register User</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4 shadow mx-auto" style="max-width: 500px;">

        <h2 class="text-center mb-4">
            User Registration
        </h2>

        <input type="text" id="username" class="form-control" placeholder="Enter Username" minlength="3" maxlength="20" pattern="[A-Za-z0-9]+" required>

        <div class="input-group mb-3">
        <input type="password" id="password" class="form-control" placeholder="Create Password" minlength="6" maxlength="20" required>
        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()"> Show </button>
        </div>
        <input type="hidden" id="role" value="PATIENT">
        <button class="btn btn-primary w-100" onclick="registerUser()">
            Register
        </button>

        <div class="text-center mt-3">
        <a href="login.html"> Already a user? Login here </a>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
