<!DOCTYPE html>
<html>
<head>
    <title>Hospital Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="dashboard.html">Hospital System</a>

        <button class="btn btn-primary" class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="patients.html">Patients</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="appointments.html">Appointments</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="billing.html">Billing</a>

                <li class="nav-item">
                    <a class="nav-link" onclick="logout()">Logout</a>
                </li>
            </ul>
        </div>

    <div class="card">
        <h2 id="recordCount">0</h2>
        <p>Total Medical Records</p>
    </div>

</div>
</div>

<script>
    if(localStorage.getItem("isLoggedIn") !== "true") {
        alert("Please Login First");
        window.location.href = "login.html";
    }
</script>
