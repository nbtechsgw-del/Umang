<!DOCTYPE html>
<html>
<head>
    <title>Patients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<script>
if(localStorage.getItem("isLoggedIn") !== "true") {
    alert("Please Login First");
    window.location.href = "login.html";
}
</script>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="admin-dashboard.html">Hospital System</a>
        <button class="navbar-toggler btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item" id="dashboardNav">
                     <a class="nav-link" href="admin-dashboard.html">Dashboard</a>
                </li>
                <li class="nav-item" id="patientsNav">
                    <a class="nav-link" href="patients.html">Patients</a>
                </li>

                <li class="nav-item" id="appointmentsNav">
                    <a class="nav-link" href="appointments.html">Appointments</a>
                </li>
                <li class="nav-item" id="billingNav">
                    <a class="nav-link" href="billing.html">Billing</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-4">
<h2>Patient Management</h2>
<form id="patientForm">
<div class="form-container">

    <input type="hidden" id="patientId">

    <input type="text" id="patientName" class="form-control" placeholder="Enter Patient Name" maxlength="50" pattern="[A-Za-z ]+" required>

    <input type="number" id="age" class="form-control" placeholder="Age" maxlength="3" min="0" max="120" required>

    <select id="gender" class="form-select" required>
        <option value=""> Select Gender </option>
        <option value="Male"> Male </option>
        <option value="Female"> Female </option>
        <option value="Other"> Other </option>
    </select>

    <input type="tel" id="contact" class="form-control" placeholder="Enter Contact Number" pattern="[0-9]{10}" maxlength="10" required>

    <textarea id="address" class="form-control" maxlength="200" placeholder="Address" required></textarea>

    <input type="text" class="form-control mb-3" id="bloodGroup" limit="4" placeholder="Blood Group">

    <button type="button" id="saveBtn" class="btn btn-primary" onclick="savePatient()">Save Patient</button>

</div>
</form>

<div class="card p-4 mt-4 shadow-sm">
    <h4 class="mb-4 text-primary">Search Patient Records</h4>
    <div class="row g-2 align-items-end mb-3">
        <div class="col-md-9">
            <label class="form-label small fw-bold">Patient Name</label>
            <input type="text" id="searchName" class="form-control" placeholder="Type name here...">
        </div>
        <div class="col-md-3">
            <button class="btn btn-primary w-100" onclick="searchPatientByName()">Search Name</button>
        </div>
    </div>
    <div class="row g-2 align-items-end mb-4">
        <div class="col-md-9">
            <label class="form-label small fw-bold">Phone Number</label>
            <input type="text" id="searchPhone" class="form-control" placeholder="Type phone number here...">
        </div>
        <div class="col-md-3">
            <button class="btn btn-primary w-100" onclick="searchPatientByPhone()">Search Phone</button>
        </div>
        <input type="number" class="form-control mb-3" id="searchId" placeholder="Search by Patient ID">
            <button class="btn btn-primary mb-3" onclick="searchPatientById()">Search ID</button>
    </div>
    <div class="text-center">
        <button class="btn btn-outline-secondary px-5" onclick="getAllPatients()">Show All Patients / Reset</button>
    </div>
</div>

<div class="d-flex gap-2 mb-3">
    <button class="btn btn-secondary" onclick="sortPatientsByName()">
        Sort By Name
    </button>
    <button class="btn btn-secondary" onclick="sortPatientsByAge()">
        Sort By Age
    </button>
</div>
<table class="table table-bordered table-hover" width="100%">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Phone</th>
            <th>Blood Group</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="patientTable">
    </tbody>
</table>
</div>
<script>
const currentRole = localStorage.getItem("role");
if(currentRole === "ADMIN") {
    document.getElementById("dashboardPageLink").href = "admin-dashboard.html";
}else if(currentRole === "DOCTOR") {
    document.getElementById("dashboardPageLink").href = "doctor-dashboard.html";
    document.getElementById("billingNav")?.remove();
}else if(currentRole === "EMPLOYEE") {
    document.getElementById("dashboardPageLink").href = "employee-dashboard.html";
}
</script>
<script src="script.js"></script>
<script>getAllPatients();</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
