<!DOCTYPE html>
<html>
<head>
    <title>Hospital Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f6f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 15px;
            background: white;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
        }

        .login-title {
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<form id="loginForm">
<div class="login-card">
    <h1 class="login-title">Hospital Login</h1>
    <div class="mb-3">
        <input type="text" id="username" class="form-control" placeholder="Enter Username" minlength="3" maxlength="20" required>
    </div>
    <div class="input-group mb-3">
    <input type="password" id="password" class="form-control" placeholder="Enter Password" minlength="6" maxlength="20" required>
    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
        Show
    </button>
    </div>
    <div class="d-grid">
        <button type="button" class="btn btn-primary btn-lg" onclick="login()">
            Login
        </button>
    </div>
    <div class="text-center mt-3">
        <a href="register.html"> Create New Account </a>
    </div>
</div>
</form>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
