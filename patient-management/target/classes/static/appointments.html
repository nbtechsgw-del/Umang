<!DOCTYPE html>
<html>
<head>
    <title>Appointments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<script>
if(localStorage.getItem("isLoggedIn") !== "true") {
    alert("Please Login first");
    window.location.href = "login.html";
}
</script>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="admin-dashboard.html">
            Hospital System
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="admin-dashboard.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="patients.html">Patients</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="appointments.html">Appointments</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="billing.html">Billing</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="card shadow p-4">
        <h2 class="mb-4 text-center">
            Appointment Management
        </h2>
        <form id="appointmentForm">
            <div class="row g-3">
                <div class="col-md-6">
                    <input type="number" id="patientId" class="form-control" placeholder="Patient ID" required>
                </div>
                <div class="col-md-6">
                    <select id="doctorId" class="form-select" required>
                     <option value="">Select Doctor</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <input type="date" id="appointmentDate" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <input type="time" id="appointmentTime" class="form-control" required>
                </div>
                <div class="col-md-6">
            
                </div>
                <div class="col-12 text-center">
                    <button type="button" class="btn btn-primary px-4" onclick="bookAppointment()">Book Appointment</button>
                </div>
            </div>
        </form>
    </div>

    <div class="card shadow mt-4 p-4">
        <h3 class="mb-3">
            Appointments List
        </h3>

        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Patient ID</th>
                        <th>Doctor</th>
                        <th>Specialization</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="appointmentTable">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="script.js"></script>
<script>
    getAllAppointments();
    loadDoctors();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
