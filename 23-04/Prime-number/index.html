<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prime Number Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="title">Prime Number Generator</div>

    <div class="row">
      <label>Start</label>
      <input type="number" id="start">
    </div>

    <div class="row">
      <label>End</label>
      <input type="number" id="end">
    </div>

    <div class="row">
      <label>Prime Number</label>
      <textarea id="result" readonly></textarea>
    </div>

    <div class="btn-container">
      <button onclick="generatePrimes()">Generate</button>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
