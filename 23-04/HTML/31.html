<html>
<body id="pageBody" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Segoe UI', sans-serif; transition: background-color 0.4s ease;">

    <h1 id="heading">Pick a Background Color</h1>
    <p>Click a button to change the theme of the page:</p>

    <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
        
        <button onclick="updateBg('#FF5733')" style="background-color: #FF5733; color: white; padding: 12px 20px; border: none; cursor: pointer; border-radius: 5px;">Sunset Orange</button>
        
        <button onclick="updateBg('#33FF57')" style="background-color: #33FF57; color: black; padding: 12px 20px; border: none; cursor: pointer; border-radius: 5px;">Lime Green</button>
        
        <button onclick="updateBg('#3357FF')" style="background-color: #3357FF; color: white; padding: 12px 20px; border: none; cursor: pointer; border-radius: 5px;">Royal Blue</button>
        
        <button onclick="updateBg('#F333FF')" style="background-color: #F333FF; color: white; padding: 12px 20px; border: none; cursor: pointer; border-radius: 5px;">Hot Pink</button>
        
        <button onclick="updateBg('#33FFF3')" style="background-color: #33FFF3; color: black; padding: 12px 20px; border: none; cursor: pointer; border-radius: 5px;">Turquoise</button>
        
        <button onclick="updateBg('#000000')" style="background-color: #000000; color: white; padding: 12px 20px; border: none; cursor: pointer; border-radius: 5px;">Midnight Black</button>

        <button onclick="updateBg('#FFFFFF')" style="background-color: #FFFFFF; color: black; border: 1px solid #ccc; padding: 12px 20px; cursor: pointer; border-radius: 5px;">Reset White</button>
    </div>

    <script src="31.js"></script>

</body>
</html>
