<html>
<body>
    <h2>Registration Form</h2>
    <form>
        First Name: <input type="text" maxlength="30"> <br><br>
        Last Name: <input type="text" maxlength="30"> <br><br>
        Date of Birth: <input type="date"> <br><br>
        
        Gender: 
        <input type="radio" name="g"> Male 
        <input type="radio" name="g"> Female <br><br>

        Permanent Address: <br>
        <textarea rows="4" cols="40" maxlength="200" placeholder="Enter your full address..."></textarea>
        <br><br>
        
        Phone Number: 
        <input type="tel" name="phone" pattern="[0-9]{10}" title="Please enter a 10-digit phone number" maxlength="10"> <br><br>
        
        Email ID: 
        <input type="email" maxlength="50"> <br><br>

        <hr>
        <h3>Login Details</h3>
        
        Username: <input type="text" maxlength="15" placeholder="Choose a username"> <br><br>
        
        Password: <input type="password" maxlength="16"> <br><br>
        
        Confirm Password: <input type="password" maxlength="16"> <br><br>
        
        <input type="submit" value="Submit Details">
    </form>
</body>
</html>
