<!DOCTYPE html>
<html>
<head>
    <title>Checkbox Gradient Creator</title>
    <link rel="stylesheet" href="33.css">
</head>
<body>

    <div class="container">
        <h1>Gradient Mixer</h1>
        <p>Select multiple colors to create a gradient:</p>

        <div class="checkbox-group">
            <label><input type="checkbox" class="color-check" value="#ff5f6d" onchange="updateBackground()"> Red</label>
            <label><input type="checkbox" class="color-check" value="#ffc371" onchange="updateBackground()"> Orange</label>
            <label><input type="checkbox" class="color-check" value="#2193b0" onchange="updateBackground()"> Blue</label>
            <label><input type="checkbox" class="color-check" value="#6dd5ed" onchange="updateBackground()"> Cyan</label>
            <label><input type="checkbox" class="color-check" value="#cc2b5e" onchange="updateBackground()"> Purple</label>
            <label><input type="checkbox" class="color-check" value="#753a88" onchange="updateBackground()"> Violet</label>
        </div>
    </div>

    <script src="33.js"></script>

</body>
</html>
