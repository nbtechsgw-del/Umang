<html>
<head>
    <title>Border Margin Padding Practical</title>
    <link rel="stylesheet" href="style2.css">    
</head>
<body>

    <h2>1. Border Practical</h2>
    <div class="box border-only">
        This box has a 5px red border.
    </div>

    <hr>

    <h2>2. Padding Practical</h2>
    <div class="box padding-only">
        This box has blue borders and 40px padding. Notice the space <b>inside</b> the box.
    </div>

    <hr>

    <h2>3. Margin Practical</h2>
    <div class="box margin-only">
        This box has green borders and 50px margin. Notice how it is pushed <b>away</b> from the edges.
    </div>

</body>
</html>
