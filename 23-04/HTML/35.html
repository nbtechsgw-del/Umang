<!DOCTYPE html>
<html>
<head>
    <title>Basic JavaScript Practical</title>
    <link rel="stylesheet" href="35.css">
</head>
<body>

    <h1 id="targetText">My name is Umang Choudhary</h1>

    <div class="button-row">
        <button onclick="changeColor('green')">Green</button>
        <button onclick="changeColor('purple')">Purple</button>
        <button onclick="changeColor('blue')">Blue</button>
    </div>

    <div class="button-row">
        <button onclick="changeSize('20px')">20px</button>
        <button onclick="changeSize('30px')">30px</button>
        <button onclick="changeSize('40px')">40px</button>
    </div>

    <div class="button-row">
        <button onclick="toggleVisibility('visible')">Show</button>
        <button onclick="toggleVisibility('hidden')">Hide</button>
    </div>

    <div class="button-row">
        <button onclick="makeBold(true)">Bold</button>
        <button onclick="makeBold(false)">Normal</button>
    </div>

    <div class="button-row">
        <button onclick="alignText('left')">Left</button>
        <button onclick="alignText('center')">Middle</button>
        <button onclick="alignText('right')">Right</button>
    </div>

    <div class="button-row">
        <button onclick="changeBg('lightblue')">Background Blue</button>
        <button onclick="changeBg('pink')">Background Pink</button>
    </div>

    <div class="button-row">
        <button onclick="changeFont('Arial')">Font 1</button>
        <button onclick="changeFont('Courier New')">Font 2</button>
        <button onclick="changeFont('Times New Roman')">Font 3</button>
    </div>

    <script src="35.js"></script>

</body>
</html>
