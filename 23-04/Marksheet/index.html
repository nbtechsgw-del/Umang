<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mark-Sheet Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Mark-Sheet Calculator</h2>

  <div class="container">

    <div class="row"><label>Hindi</label><input type="number" id="hindi"><span>(Max : 100)</span></div>
    <div class="row"><label>English</label><input type="number" id="english"><span>(Max : 100)</span></div>
    <div class="row"><label>Maths</label><input type="number" id="maths"><span>(Max : 100)</span></div>
    <div class="row"><label>Science</label><input type="number" id="science"><span>(Max : 100)</span></div>
    <div class="row"><label>Art</label><input type="number" id="art"><span>(Max : 100)</span></div>
    <div class="row"><label>Computer</label><input type="number" id="computer"><span>(Max : 100)</span></div>

    <div class="row"><label>Total</label><input type="text" id="total" readonly></div>
    <div class="row"><label>Percentage</label><input type="text" id="percentage" readonly></div>
    <div class="row"><label>Grade</label><input type="text" id="grade" readonly></div>

    <div class="btn-container">
      <button onclick="calculate()">Calculate</button>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
