<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="address.css">
</head>
<body>

<div class="form-container">
    <h2>Student Registration Form</h2>
    <form>
        <label>Full Name:</label><br>
        <input type="text" id="name" placeholder="Enter your name" maxlength="30"><br><br>

        <label>Email ID:</label><br>
        <input type="email" id="email" placeholder="example@mail.com"><br><br>

        <label>Permanent Address:</label><br>
        <textarea id="p_address" rows="4"></textarea><br><br>

        <input type="checkbox" id="same_as" onclick="copyAddress()"> 
        <label for="same_as"><b>Current Address is same as Permanent Address</b></label>
        <br><br>

        <label>Current Address:</label><br>
        <textarea id="c_address" rows="4"></textarea><br><br>

        <button type="submit" class="submit-btn">Register Now</button>
    </form>
</div>

<script src="address.js"></script>
</body>
</html>
